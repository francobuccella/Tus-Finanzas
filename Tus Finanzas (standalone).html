olor-accent-900: #3a270d;\n\n  --color-accent-2-100: #fff3e4;\n  --color-accent-2-200: #ffe3be;\n  --color-accent-2-300: #f5cd96;\n  --color-accent-2-400: #dbaf70;\n  --color-accent-2-500: #bc8f4e;\n  --color-accent-2-600: #9b7232;\n  --color-accent-2-700: #79561f;\n  --color-accent-2-800: #573d14;\n  --color-accent-2-900: #382810;\n\n  --font-heading: \"Cormorant Garamond\", system-ui, sans-serif;\n  --font-heading-weight: 600; /* review round 3: bold retired — semibold is the\n     interface headings' ceiling (they need the weight at small sizes); display\n     text goes lighter still, to the normal cut (see the deck) */\n  --font-body: \"Lora\", system-ui, sans-serif;\n\n  --space-1: 4.6px;\n  --space-2: 9.2px;\n  --space-3: 13.8px;\n  --space-4: 18.4px;\n  --space-6: 27.6px;\n  --space-8: 36.8px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.plate{filter:sepia(0.22) saturate(0.82) contrast(1.05);box-sizing:border-box;\n  border:6px solid var(--color-surface);outline:1px solid var(--color-divider)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: transparent;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: transparent; border: 1px solid var(--color-divider);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 1px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg); border: 1px solid var(--color-divider);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"e763b13b-550a-4413-afc0-2b3ba77ee4b5\"><\u002Fscript>\n  <style>\n    body{margin:0}\n    @keyframes tf-spin{to{transform:rotate(360deg)}}\n    ::-webkit-scrollbar{width:0;height:0}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--color-surface);padding:48px 24px;font-family:var(--font-body);\">\n\n  <div style=\"width:390px;height:844px;flex:none;border-radius:52px;border:10px solid var(--color-neutral-900);background:var(--color-bg);box-shadow:var(--shadow-lg);overflow:hidden;position:relative;display:flex;flex-direction:column;color:var(--color-text);\">\n\n    <div style=\"flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-family:var(--font-heading);font-weight:600;font-size:13px;\">\n      <span>9:41<\u002Fspan>\n      <span style=\"letter-spacing:0.02em;\">Tus Finanzas<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- WELCOME -->\n    <sc-if value=\"{{ isWelcome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex:1;overflow-y:auto;padding:8px 28px 28px;display:flex;flex-direction:column;\">\n        <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--space-4);\">\n          <div style=\"height:210px;border:6px solid var(--color-surface);outline:1px solid var(--color-divider);background:repeating-linear-gradient(135deg,var(--color-neutral-200),var(--color-neutral-200) 10px,var(--color-neutral-100) 10px,var(--color-neutral-100) 20px);display:flex;align-items:center;justify-content:center;\">\n            <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:var(--color-neutral-600);\">ilustración: app en uso<\u002Fspan>\n          <\u002Fdiv>\n          <div>\n            <h6 style=\"color:var(--color-accent-700);margin:0 0 6px;\">Finanzas personales<\u002Fh6>\n            <h1 style=\"margin:0 0 10px;\">Tus Finanzas<\u002Fh1>\n            <p style=\"margin:0;opacity:0.75;font-size:15px;line-height:1.5;\">Gastos, ingresos e inversiones de todas tus cuentas, en un solo lugar — clasificados automáticamente.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;display:flex;flex-direction:column;gap:var(--space-2);padding-top:var(--space-4);\">\n          <button class=\"btn btn-primary btn-block\" style=\"height:48px;font-size:15px;\" onclick=\"{{ goToSignup }}\">Comenzar<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-block\" style=\"height:40px;\" onclick=\"{{ goToLogin }}\">Ya tengo una cuenta<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- SIGNUP -->\n    <sc-if value=\"{{ isSignup }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow-y:auto;padding:8px 24px 16px;display:flex;flex-direction:column;\">\n        <h6 style=\"color:var(--color-accent-700);margin:0 0 6px;\">Crear cuenta<\u002Fh6>\n        <h2 style=\"margin:0 0 6px;\">Registrate<\u002Fh2>\n        <p style=\"margin:0 0 20px;font-size:13px;opacity:0.7;\">Tus datos se guardan en tu cuenta y podés verlos desde cualquier dispositivo.<\u002Fp>\n\n        <div class=\"field\" style=\"margin-bottom:var(--space-3);\">\n          <label>Email<\u002Flabel>\n          <input class=\"input\" type=\"email\" placeholder=\"vos@ejemplo.com\" value=\"{{ authEmail }}\" oninput=\"{{ onAuthEmailInput }}\">\n        <\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:var(--space-3);\">\n          <label>Contraseña<\u002Flabel>\n          <input class=\"input\" type=\"password\" placeholder=\"Mínimo 6 caracteres\" value=\"{{ authPassword }}\" oninput=\"{{ onAuthPasswordInput }}\">\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasAuthError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0 0 var(--space-2);font-size:12px;color:var(--color-accent-900);\">{{ authError }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:none;padding:var(--space-3) var(--space-4);border-top:1px solid var(--color-divider);background:var(--color-bg);\">\n        <button class=\"btn btn-primary btn-block\" style=\"height:46px;\" onclick=\"{{ submitSignup }}\" disabled=\"{{ authBusy }}\">Crear cuenta<\u002Fbutton>\n        <button class=\"btn btn-ghost btn-block\" style=\"height:36px;\" onclick=\"{{ goToWelcome }}\">Volver<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- LOGIN -->\n    <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow-y:auto;padding:8px 24px 16px;display:flex;flex-direction:column;\">\n        <h6 style=\"color:var(--color-accent-700);margin:0 0 6px;\">Bienvenido de nuevo<\u002Fh6>\n        <h2 style=\"margin:0 0 6px;\">Iniciar sesión<\u002Fh2>\n        <p style=\"margin:0 0 20px;font-size:13px;opacity:0.7;\">Entrá con el email y la contraseña de tu cuenta.<\u002Fp>\n\n        <div class=\"field\" style=\"margin-bottom:var(--space-3);\">\n          <label>Email<\u002Flabel>\n          <input class=\"input\" type=\"email\" placeholder=\"vos@ejemplo.com\" value=\"{{ authEmail }}\" oninput=\"{{ onAuthEmailInput }}\">\n        <\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:var(--space-3);\">\n          <label>Contraseña<\u002Flabel>\n          <input class=\"input\" type=\"password\" placeholder=\"Tu contraseña\" value=\"{{ authPassword }}\" oninput=\"{{ onAuthPasswordInput }}\">\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasAuthError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0 0 var(--space-2);font-size:12px;color:var(--color-accent-900);\">{{ authError }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:none;padding:var(--space-3) var(--space-4);border-top:1px solid var(--color-divider);background:var(--color-bg);\">\n        <button class=\"btn btn-primary btn-block\" style=\"height:46px;\" onclick=\"{{ submitLogin }}\" disabled=\"{{ authBusy }}\">Iniciar sesión<\u002Fbutton>\n        <button class=\"btn btn-ghost btn-block\" style=\"height:36px;\" onclick=\"{{ goToWelcome }}\">Volver<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- PROCESSING -->\n    <sc-if value=\"{{ isProcessing }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4);padding:0 40px;text-align:center;\">\n        <div style=\"width:56px;height:56px;border:3px solid var(--color-divider);border-top-color:var(--color-accent);border-radius:50%;animation:tf-spin 1s linear infinite;\"><\u002Fdiv>\n        <div>\n          <h4 style=\"margin:0 0 6px;\">{{ processingTitle }}<\u002Fh4>\n          <p style=\"margin:0;font-size:13px;opacity:0.65;\">{{ processingSubtitle }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- APP -->\n    <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow-y:auto;padding:6px 22px 24px;\">\n\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);\">\n          <div>\n            <div style=\"font-size:12px;opacity:0.6;\">Hola,<\u002Fdiv>\n            <h4 style=\"margin:0;\">{{ userLabel }}<\u002Fh4>\n          <\u002Fdiv>\n          <button class=\"btn btn-icon btn-secondary\" onclick=\"{{ logout }}\"><i data-lucide=\"log-out\" style=\"width:17px;height:17px;\"><\u002Fi><\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isTabHome }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"seg\" style=\"margin-bottom:var(--space-4);\">\n            <label class=\"seg-opt\"><input type=\"radio\" name=\"period\" checked=\"{{ isWeek }}\" onchange=\"{{ setWeek }}\"><span>Semana<\u002Fspan><\u002Flabel>\n            <label class=\"seg-opt\"><input type=\"radio\" name=\"period\" checked=\"{{ isMonth }}\" onchange=\"{{ setMonth }}\"><span>Mes<\u002Fspan><\u002Flabel>\n          <\u002Fdiv>\n\n          <div class=\"card elev-sm\" style=\"margin-bottom:var(--space-3);align-items:flex-start;\">\n            <span class=\"card-kicker\">Balance total<\u002Fspan>\n            <h1 style=\"margin:0;font-variant-numeric:tabular-nums;\">{{ totals.balanceLabel }}<\u002Fh1>\n            <div style=\"display:flex;gap:var(--space-4);margin-top:var(--space-1);\">\n              <div>\n                <div style=\"font-size:11px;opacity:0.55;\">Ingresos<\u002Fdiv>\n                <div style=\"font-size:14px;font-weight:600;\">{{ totals.incomeLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11px;opacity:0.55;\">Gastos<\u002Fdiv>\n                <div style=\"font-size:14px;font-weight:600;\">{{ totals.expenseLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px;\">\n            <h6 style=\"margin:0;color:var(--color-accent-700);\">Tus cuentas<\u002Fh6>\n            <button class=\"btn btn-icon btn-secondary\" style=\"width:28px;height:28px;\" onclick=\"{{ openAddAccount }}\"><i data-lucide=\"plus\" style=\"width:14px;height:14px;\"><\u002Fi><\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasAccounts }}\" hint-placeholder-val=\"{{ true }}\">\n            <sc-for list=\"{{ accounts }}\" as=\"acc\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;border-bottom:1px solid var(--color-divider);\">\n                <div style=\"width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--color-divider);background:var(--color-accent-100);color:var(--color-accent-800);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:600;font-size:12px;\">{{ acc.initial }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-size:13px;\">{{ acc.name }}<\u002Fdiv>\n                  <div style=\"font-size:11px;opacity:0.55;\">{{ acc.kind }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;\">{{ acc.balanceLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noAccounts }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0 0 var(--space-3);font-size:12px;opacity:0.6;\">Todavía no agregaste ninguna cuenta.<\u002Fp>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:var(--space-4) 0 10px;\">\n            <h6 style=\"margin:0;color:var(--color-accent-700);\">Gastos por categoría<\u002Fh6>\n            <div style=\"display:flex;gap:6px;\">\n              <button class=\"btn btn-icon btn-secondary\" style=\"width:28px;height:28px;\" onclick=\"{{ openImport }}\" title=\"Importar CSV\"><i data-lucide=\"upload\" style=\"width:14px;height:14px;\"><\u002Fi><\u002Fbutton>\n              <button class=\"btn btn-icon btn-secondary\" style=\"width:28px;height:28px;\" onclick=\"{{ openAddTx }}\" title=\"Agregar movimiento\"><i data-lucide=\"plus\" style=\"width:14px;height:14px;\"><\u002Fi><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasCategories }}\" hint-placeholder-val=\"{{ true }}\">\n            <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"margin-bottom:var(--space-3);\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px;\">\n                  <i data-lucide=\"{{ c.icon }}\" style=\"width:15px;height:15px;color:var(--color-accent-700);\"><\u002Fi>\n                  <span style=\"font-size:13px;flex:1;\">{{ c.name }}<\u002Fspan>\n                  <span style=\"font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;\">{{ c.amountLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:5px;border-radius:3px;background:var(--color-neutral-200);overflow:hidden;\">\n                  <div style=\"height:100%;background:var(--color-accent);width:{{ c.pctWidth }};\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noCategories }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:12px;opacity:0.6;\">Todavía no cargaste ningún movimiento.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTabBudgets }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;\">\n            <h6 style=\"margin:0;color:var(--color-accent-700);\">Presupuestos del mes<\u002Fh6>\n            <button class=\"btn btn-icon btn-secondary\" style=\"width:28px;height:28px;\" onclick=\"{{ openAddBudget }}\"><i data-lucide=\"plus\" style=\"width:14px;height:14px;\"><\u002Fi><\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasBudgets }}\" hint-placeholder-val=\"{{ true }}\">\n            <sc-for list=\"{{ budgets }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div class=\"card\" style=\"margin-bottom:var(--space-2);gap:6px;\">\n                <div style=\"display:flex;justify-content:space-between;\">\n                  <span class=\"card-title\" style=\"font-size:14px;\">{{ b.name }}<\u002Fspan>\n                  <span style=\"font-size:12px;font-weight:600;color:{{ b.statusColor }};\">{{ b.statusLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:6px;border-radius:3px;background:var(--color-neutral-200);overflow:hidden;\">\n                  <div style=\"height:100%;background:{{ b.barColor }};width:{{ b.pctWidth }};\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;opacity:0.6;\">{{ b.spentLabel }} de {{ b.limitLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noBudgets }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0 0 var(--space-2);font-size:12px;opacity:0.6;\">Todavía no armaste presupuestos.<\u002Fp>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin:var(--space-4) 0 10px;\">\n            <h6 style=\"margin:0;color:var(--color-accent-700);\">Metas de ahorro<\u002Fh6>\n            <button class=\"btn btn-icon btn-secondary\" style=\"width:28px;height:28px;\" onclick=\"{{ openAddGoal }}\"><i data-lucide=\"plus\" style=\"width:14px;height:14px;\"><\u002Fi><\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasGoals }}\" hint-placeholder-val=\"{{ true }}\">\n            <sc-for list=\"{{ goals }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <div class=\"card\" style=\"margin-bottom:var(--space-2);gap:6px;\">\n                <span class=\"card-title\" style=\"font-size:14px;\">{{ g.name }}<\u002Fspan>\n                <div style=\"height:6px;border-radius:3px;background:var(--color-neutral-200);overflow:hidden;\">\n                  <div style=\"height:100%;background:var(--color-accent);width:{{ g.pctWidth }};\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;opacity:0.6;\">{{ g.savedLabel }} de {{ g.targetLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noGoals }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:12px;opacity:0.6;\">Todavía no creaste metas de ahorro.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTabInvestments }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card elev-sm\" style=\"margin-bottom:var(--space-4);gap:8px;align-items:flex-start;\">\n            <span class=\"card-kicker\">Portafolio total<\u002Fspan>\n            <h1 style=\"margin:0;font-variant-numeric:tabular-nums;\">{{ portfolio.totalLabel }}<\u002Fh1>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;\">\n            <h6 style=\"margin:0;color:var(--color-accent-700);\">Tus fondos<\u002Fh6>\n            <button class=\"btn btn-icon btn-secondary\" style=\"width:28px;height:28px;\" onclick=\"{{ openAddHolding }}\"><i data-lucide=\"plus\" style=\"width:14px;height:14px;\"><\u002Fi><\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasHoldings }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;height:12px;border-radius:6px;overflow:hidden;margin-bottom:var(--space-4);\">\n              <sc-for list=\"{{ holdings }}\" as=\"h\" hint-placeholder-count=\"4\">\n                <div style=\"height:100%;width:{{ h.allocWidth }};background:{{ h.shade }};\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ holdings }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:var(--space-2) 0;border-bottom:1px solid var(--color-divider);\">\n                <div style=\"width:10px;height:10px;border-radius:50%;background:{{ h.shade }};flex:none;\"><\u002Fdiv>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-size:13px;font-weight:600;\">{{ h.name }}<\u002Fdiv>\n                  <div style=\"font-size:11px;opacity:0.55;\">{{ h.ticker }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:right;\">\n                  <div style=\"font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;\">{{ h.valueLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noHoldings }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:12px;opacity:0.6;\">Todavía no cargaste ningún fondo o inversión.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"flex:none;display:flex;border-top:1px solid var(--color-divider);background:var(--color-bg);\">\n        <button style=\"flex:1;background:transparent;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:{{ tabColor.home }};font-family:var(--font-heading);font-size:10px;\" onclick=\"{{ setTabHome }}\"><i data-lucide=\"home\" style=\"width:19px;height:19px;\"><\u002Fi>Inicio<\u002Fbutton>\n        <button style=\"flex:1;background:transparent;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:{{ tabColor.budgets }};font-family:var(--font-heading);font-size:10px;\" onclick=\"{{ setTabBudgets }}\"><i data-lucide=\"piggy-bank\" style=\"width:19px;height:19px;\"><\u002Fi>Metas<\u002Fbutton>\n        <button style=\"flex:1;background:transparent;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:{{ tabColor.investments }};font-family:var(--font-heading);font-size:10px;\" onclick=\"{{ setTabInvestments }}\"><i data-lucide=\"trending-up\" style=\"width:19px;height:19px;\"><\u002Fi>Inversiones<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ADD GOAL DIALOG -->\n    <sc-if value=\"{{ addGoalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"dialog-backdrop\" style=\"position:absolute;\">\n        <div class=\"dialog\">\n          <span class=\"dialog-title\">Nueva meta<\u002Fspan>\n          <div class=\"field\">\n            <label>Nombre<\u002Flabel>\n            <input class=\"input\" placeholder=\"Ej: Vacaciones\" value=\"{{ newGoalName }}\" oninput=\"{{ onGoalNameInput }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Monto objetivo<\u002Flabel>\n            <input class=\"input\" placeholder=\"Ej: 500000\" value=\"{{ newGoalAmount }}\" oninput=\"{{ onGoalAmountInput }}\">\n          <\u002Fdiv>\n          <div class=\"dialog-actions\">\n            <button class=\"btn btn-secondary\" onclick=\"{{ closeAddGoal }}\">Cancelar<\u002Fbutton>\n            <button class=\"btn btn-primary\" onclick=\"{{ submitGoal }}\">Crear<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ADD ACCOUNT DIALOG -->\n    <sc-if value=\"{{ addAccountOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"dialog-backdrop\" style=\"position:absolute;\">\n        <div class=\"dialog\">\n          <span class=\"dialog-title\">Nueva cuenta<\u002Fspan>\n          <div class=\"field\">\n            <label>Nombre<\u002Flabel>\n            <input class=\"input\" placeholder=\"Ej: Mercado Pago\" value=\"{{ newAccountName }}\" oninput=\"{{ onAccountNameInput }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Tipo<\u002Flabel>\n            <input class=\"input\" placeholder=\"Ej: Billetera virtual, Banco\" value=\"{{ newAccountKind }}\" oninput=\"{{ onAccountKindInput }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Saldo inicial<\u002Flabel>\n            <input class=\"input\" placeholder=\"Ej: 50000\" value=\"{{ newAccountBalance }}\" oninput=\"{{ onAccountBalanceInput }}\">\n          <\u002Fdiv>\n          <div class=\"dialog-actions\">\n            <button class=\"btn btn-secondary\" onclick=\"{{ closeAddAccount }}\">Cancelar<\u002Fbutton>\n            <button class=\"btn btn-primary\" onclick=\"{{ submitAccount }}\" disabled=\"{{ formBusy }}\">Crear<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ADD TRANSACTION DIALOG -->\n    <sc-if value=\"{{ addTxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"dialog-backdrop\" style=\"position:absolute;\">\n        <div class=\"dialog\">\n          <span class=\"dialog-title\">Nuevo movimiento<\u002Fspan>\n          <sc-if value=\"{{ noAccounts }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:13px;opacity:0.75;\">Primero agregá una cuenta para poder cargar movimientos.<\u002Fp>\n            <div class=\"dialog-actions\">\n              <button class=\"btn btn-secondary\" onclick=\"{{ closeAddTx }}\">Cerrar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasAccounts }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"seg\">\n              <label class=\"seg-opt\"><input type=\"radio\" name=\"txtype\" checked=\"{{ isTxExpense }}\" onchange=\"{{ setTxExpense }}\"><span>Gasto<\u002Fspan><\u002Flabel>\n              <label class=\"seg-opt\"><input type=\"radio\" name=\"txtype\" checked=\"{{ isTxIncome }}\" onchange=\"{{ setTxIncome }}\"><span>Ingreso<\u002Fspan><\u002Flabel>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Cuenta<\u002Flabel>\n              <select class=\"input\" onchange=\"{{ onTxAccountInput }}\">\n                <sc-for list=\"{{ accounts }}\" as=\"acc\" hint-placeholder-count=\"2\">\n                  <option value=\"{{ acc.id }}\" selected=\"{{ acc.selected }}\">{{ acc.name }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fselect>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Categoría<\u002Flabel>\n              <input class=\"input\" placeholder=\"Ej: Comida, Transporte, Sueldo\" value=\"{{ newTxCategory }}\" oninput=\"{{ onTxCategoryInput }}\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Monto<\u002Flabel>\n              <input class=\"input\" placeholder=\"Ej: 15000\" value=\"{{ newTxAmount }}\" oninput=\"{{ onTxAmountInput }}\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Nota (opcional)<\u002Flabel>\n              <input class=\"input\" placeholder=\"Ej: Supermercado\" value=\"{{ newTxNote }}\" oninput=\"{{ onTxNoteInput }}\">\n            <\u002Fdiv>\n            <div class=\"dialog-actions\">\n              <button class=\"btn btn-secondary\" onclick=\"{{ closeAddTx }}\">Cancelar<\u002Fbutton>\n              <button class=\"btn btn-primary\" onclick=\"{{ submitTx }}\" disabled=\"{{ formBusy }}\">Guardar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- IMPORT CSV DIALOG -->\n    <sc-if value=\"{{ importOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"dialog-backdrop\" style=\"position:absolute;\">\n        <div class=\"dialog\" style=\"max-height:82%;overflow-y:auto;\">\n          <span class=\"dialog-title\">Importar movimientos (CSV)<\u002Fspan>\n          <sc-if value=\"{{ noAccounts }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:13px;opacity:0.75;\">Primero agregá una cuenta para poder importar movimientos.<\u002Fp>\n            <div class=\"dialog-actions\">\n              <button class=\"btn btn-secondary\" onclick=\"{{ closeImport }}\">Cerrar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasAccounts }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"field\">\n              <label>Cuenta<\u002Flabel>\n              <select class=\"input\" onchange=\"{{ onImportAccountInput }}\">\n                <sc-for list=\"{{ importAccountOptions }}\" as=\"acc\" hint-placeholder-count=\"2\">\n                  <option value=\"{{ acc.id }}\" selected=\"{{ acc.selected }}\">{{ acc.name }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fselect>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Archivo CSV<\u002Flabel>\n              <input class=\"input\" type=\"file\" accept=\".csv,text/csv\" onchange=\"{{ onImportFileChange }}\">\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasImportError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0 0 var(--space-2);font-size:12px;color:var(--color-accent-900);\">{{ importError }}<\u002Fp>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasImportRows }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0 0 var(--space-2);font-size:12px;opacity:0.7;\">{{ importRowCount }} filas detectadas en {{ importFileName }}.<\u002Fp>\n              <div class=\"field\">\n                <label>Columna de fecha<\u002Flabel>\n                <select class=\"input\" onchange=\"{{ onImportDateColInput }}\">\n                  <sc-for list=\"{{ importDateOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <option value=\"{{ o.value }}\" selected=\"{{ o.selected }}\">{{ o.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fselect>\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Columna de monto<\u002Flabel>\n                <select class=\"input\" onchange=\"{{ onImportAmountColInput }}\">\n                  <sc-for list=\"{{ importAmountOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <option value=\"{{ o.value }}\" selected=\"{{ o.selected }}\">{{ o.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fselect>\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Columna de descripción<\u002Flabel>\n                <select class=\"input\" onchange=\"{{ onImportDescColInput }}\">\n                  <sc-for list=\"{{ importDescOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <option value=\"{{ o.value }}\" selected=\"{{ o.selected }}\">{{ o.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fselect>\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>¿Qué signo es un gasto?<\u002Flabel>\n                <div class=\"seg\">\n                  <label class=\"seg-opt\"><input type=\"radio\" name=\"importsign\" checked=\"{{ importSignIsNegative }}\" onchange=\"{{ setImportSignNegative }}\"><span>Negativo<\u002Fspan><\u002Flabel>\n                  <label class=\"seg-opt\"><input type=\"radio\" name=\"importsign\" checked=\"{{ importSignIsPositive }}\" onchange=\"{{ setImportSignPositive }}\"><span>Positivo<\u002Fspan><\u002Flabel>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div class=\"dialog-actions\">\n              <button class=\"btn btn-secondary\" onclick=\"{{ closeImport }}\">Cancelar<\u002Fbutton>\n              <button class=\"btn btn-primary\" onclick=\"{{ submitImport }}\" disabled=\"{{ importSubmitDisabled }}\">{{ importSubmitLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ADD BUDGET DIALOG -->\n    <sc-if value=\"{{ addBudgetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"dialog-backdrop\" style=\"position:absolute;\">\n        <div class=\"dialog\">\n          <span class=\"dialog-title\">Nuevo presupuesto<\u002Fspan>\n          <div class=\"field\">\n            <label>Categoría<\u002Flabel>\n            <input class=\"input\" placeholder=\"Ej: Comida\" value=\"{{ newBudgetCategory }}\" oninput=\"{{ onBudgetCategoryInput }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Límite mensual<\u002Flabel>\n            <input class=\"input\" placeholder=\"Ej: 150000\" value=\"{{ newBudgetLimit }}\" oninput=\"{{ onBudgetLimitInput }}\">\n          <\u002Fdiv>\n          <div class=\"dialog-actions\">\n            <button class=\"btn btn-secondary\" onclick=\"{{ closeAddBudget }}\">Cancelar<\u002Fbutton>\n            <button class=\"btn btn-primary\" onclick=\"{{ submitBudget }}\" disabled=\"{{ formBusy }}\">Crear<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ADD HOLDING DIALOG -->\n    <sc-if value=\"{{ addHoldingOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"dialog-backdrop\" style=\"position:absolute;\">\n        <div class=\"dialog\">\n          <span class=\"dialog-title\">Nuevo fondo<\u002Fspan>\n          <div class=\"field\">\n            <label>Nombre<\u002Flabel>\n            <input class=\"input\" placeholder=\"Ej: CEDEARs, Fondo Money Market\" value=\"{{ newHoldingName }}\" oninput=\"{{ onHoldingNameInput }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Ticker (opcional)<\u002Flabel>\n            <input class=\"input\" placeholder=\"Ej: FCI\" value=\"{{ newHoldingTicker }}\" oninput=\"{{ onHoldingTickerInput }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Valor actual<\u002Flabel>\n            <input class=\"input\" placeholder=\"Ej: 500000\" value=\"{{ newHoldingValue }}\" oninput=\"{{ onHoldingValueInput }}\">\n          <\u002Fdiv>\n          <div class=\"dialog-actions\">\n            <button class=\"btn btn-secondary\" onclick=\"{{ closeAddHolding }}\">Cancelar<\u002Fbutton>\n            <button class=\"btn btn-primary\" onclick=\"{{ submitHolding }}\" disabled=\"{{ formBusy }}\">Crear<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 480, &quot;height&quot;: 900},\n  &quot;initialScreen&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;welcome&quot;, &quot;options&quot;: [&quot;welcome&quot;, &quot;connect&quot;, &quot;processing&quot;, &quot;app&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Demo&quot;},\n  &quot;initialPeriod&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;month&quot;, &quot;options&quot;: [&quot;week&quot;, &quot;month&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Demo&quot;},\n  &quot;showAIBadges&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Demo&quot;}\n}\">\nconst SUPABASE_URL = 'https://xcexrycodletuzhmhihd.supabase.co';\nconst SUPABASE_ANON_KEY = 'sb_publishable_p4weGdazY3cCWK4cot5cGQ_wyrhkXuQ';\n\n// Loaded lazily (rather than via a <script> tag in <head>) because the\n// dc-runtime evaluates this class as soon as its own script finishes\n// loading, without reliably waiting for sibling <script src> tags — a\n// top-level `supabase.createClient(...)` call here would race that.\nlet _sbClient = null;\nlet _sbLoadPromise = null;\nfunction loadSupabaseLib() {\n  if (window.supabase) return Promise.resolve(window.supabase);\n  if (!_sbLoadPromise) {\n    _sbLoadPromise = new Promise((resolve, reject) => {\n      const s = document.createElement('script');\n      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';\n      s.onload = () => resolve(window.supabase);\n      s.onerror = () => reject(new Error('No se pudo cargar la librería de Supabase.'));\n      document.head.appendChild(s);\n    });\n  }\n  return _sbLoadPromise;\n}\nasync function getSb() {\n  if (_sbClient) return _sbClient;\n  const lib = await loadSupabaseLib();\n  _sbClient = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);\n  return _sbClient;\n}\n\nconst CATEGORY_ICONS = {\n  'Comida': 'utensils', 'Servicios': 'zap', 'Transporte': 'car',\n  'Entretenimiento': 'clapperboard', 'Salud': 'heart-pulse', 'Sueldo': 'wallet',\n  'Otros': 'more-horizontal',\n};\nfunction iconFor(cat) { return CATEGORY_ICONS[cat] || 'more-horizontal'; }\n\nfunction money(n) {\n  return '$' + Math.round(n).toLocaleString('es-AR');\n}\n\nfunction isInCurrentMonth(dateStr) {\n  const d = new Date(dateStr + 'T00:00:00');\n  const now = new Date();\n  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();\n}\nfunction guessCategory(desc) {\n  const d = (desc || '').toLowerCase();\n  for (const cat of Object.keys(CATEGORY_ICONS)) {\n    if (d.includes(cat.toLowerCase())) return cat;\n  }\n  return 'Otros';\n}\n\n// Bank/wallet CSV exports vary (comma vs semicolon delimiter, quoted\n// fields with embedded delimiters). This is a small hand-rolled parser\n// rather than a library so the app stays dependency-free and offline-safe.\nfunction parseCsv(text) {\n  const cleaned = text.replace(/^﻿/, '').replace(/\\r\\n/g, '\\n').trim();\n  const lines = cleaned.split('\\n').filter((l) => l.length > 0);\n  if (lines.length === 0) return { headers: [], rows: [] };\n  const delimiter = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ';' : ',';\n  function parseLine(line) {\n    const out = [];\n    let cur = '';\n    let inQuotes = false;\n    for (let i = 0; i < line.length; i++) {\n      const c = line[i];\n      if (inQuotes) {\n        if (c === '\"' && line[i + 1] === '\"') { cur += '\"'; i++; }\n        else if (c === '\"') { inQuotes = false; }\n        else { cur += c; }\n      } else if (c === '\"') {\n        inQuotes = true;\n      } else if (c === delimiter) {\n        out.push(cur); cur = '';\n      } else {\n        cur += c;\n      }\n    }\n    out.push(cur);\n    return out.map((s) => s.trim());\n  }\n  const headers = parseLine(lines[0]);\n  const rows = lines.slice(1).map(parseLine).filter((r) => r.some((v) => v !== ''));\n  return { headers, rows };\n}\n\nfunction guessColumn(headers, keywords) {\n  const lower = headers.map((h) => h.toLowerCase());\n  for (const kw of keywords) {\n    const i = lower.findIndex((h) => h.includes(kw));\n    if (i !== -1) return headers[i];\n  }\n  return headers[0] || '';\n}\n\nfunction parseAmountAR(raw) {\n  let s = String(raw == null ? '' : raw).trim().replace(/[^0-9,.\\-]/g, '');\n  if (!s) return NaN;\n  const neg = s.startsWith('-');\n  s = s.replace(/-/g, '');\n  if (s.includes(',') && s.includes('.')) {\n    s = s.replace(/\\./g, '').replace(',', '.');\n  } else if (s.includes(',')) {\n    s = s.replace(',', '.');\n  }\n  const n = parseFloat(s);\n  if (Number.isNaN(n)) return NaN;\n  return neg ? -n : n;\n}\n\nfunction parseDateFlexible(raw) {\n  const s = String(raw == null ? '' : raw).trim();\n  let m = s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);\n  if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');\n  m = s.match(/^(\\d{1,2})[\\/\\-](\\d{1,2})[\\/\\-](\\d{4})/);\n  if (m) return m[3] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');\n  return null;\n}\n\nfunction isInLastNDays(dateStr, days) {\n  const d = new Date(dateStr + 'T00:00:00');\n  const now = new Date();\n  const diffDays = (now - d) / 86400000;\n  return diffDays >= 0 && diffDays < days;\n}\n\nclass Component extends DCLogic {\n  state = {\n    screen: this.props.initialScreen || 'processing',\n    activeTab: 'home',\n    period: this.props.initialPeriod || 'month',\n\n    session: null,\n    userEmail: '',\n    authEmail: '',\n    authPassword: '',\n    authError: '',\n    authBusy: false,\n\n    accounts: [],\n    transactions: [],\n    budgets: [],\n    holdings: [],\n    goals: [],\n\n    formBusy: false,\n\n    addAccountOpen: false, newAccountName: '', newAccountKind: '', newAccountBalance: '',\n    addTxOpen: false, newTxType: 'expense', newTxAccountId: '', newTxCategory: '', newTxAmount: '', newTxNote: '',\n    importOpen: false, importAccountId: '', importFileName: '', importHeaders: [], importRows: [],\n    importDateCol: '', importAmountCol: '', importDescCol: '', importSign: 'negative', importError: '',\n    addBudgetOpen: false, newBudgetCategory: '', newBudgetLimit: '',\n    addHoldingOpen: false, newHoldingName: '', newHoldingTicker: '', newHoldingValue: '',\n    addGoalOpen: false, newGoalName: '', newGoalAmount: '',\n  };\n\n  async componentDidMount() {\n    this.runIcons();\n    const sb = await getSb();\n    const { data } = await sb.auth.getSession();\n    if (data.session) {\n      await this.loadUserData(data.session.user);\n    } else {\n      this.setState({ screen: 'welcome' });\n    }\n  }\n  componentDidUpdate() { this.runIcons(); }\n  runIcons() { if (window.lucide) window.lucide.createIcons(); }\n\n  async loadUserData(user) {\n    this.setState({ screen: 'processing', session: true, userEmail: user.email });\n    const sb = await getSb();\n    const [accRes, txRes, budRes, holRes, goalRes] = await Promise.all([\n      sb.from('accounts').select('*').order('created_at'),\n      sb.from('transactions').select('*').order('occurred_at', { ascending: false }),\n      sb.from('budgets').select('*').order('created_at'),\n      sb.from('holdings').select('*').order('created_at'),\n      sb.from('goals').select('*').order('created_at'),\n    ]);\n    this.setState({\n      accounts: accRes.data || [],\n      transactions: txRes.data || [],\n      budgets: budRes.data || [],\n      holdings: holRes.data || [],\n      goals: goalRes.data || [],\n      screen: 'app',\n      activeTab: 'home',\n    });\n  }\n\n  goToWelcome = () => this.setState({ screen: 'welcome', authError: '' });\n  goToSignup = () => this.setState({ screen: 'signup', authEmail: '', authPassword: '', authError: '' });\n  goToLogin = () => this.setState({ screen: 'login', authEmail: '', authPassword: '', authError: '' });\n  onAuthEmailInput = (e) => this.setState({ authEmail: e.target.value, authError: '' });\n  onAuthPasswordInput = (e) => this.setState({ authPassword: e.target.value, authError: '' });\n\n  submitSignup = async () => {\n    const s = this.state;\n    if (!s.authEmail.trim() || s.authPassword.length < 6) {\n      this.setState({ authError: 'Ingresá un email válido y una contraseña de al menos 6 caracteres.' });\n      return;\n    }\n    this.setState({ authBusy: true, authError: '' });\n    const sb = await getSb();\n    const { data, error } = await sb.auth.signUp({ email: s.authEmail.trim(), password: s.authPassword });\n    if (error) { this.setState({ authBusy: false, authError: error.message }); return; }\n    if (data.session) {\n      await this.loadUserData(data.session.user);\n    } else {\n      this.setState({ authBusy: false, screen: 'login', authError: 'Revisá tu email para confirmar la cuenta y después iniciá sesión.' });\n    }\n  };\n\n  submitLogin = async () => {\n    const s = this.state;\n    this.setState({ authBusy: true, authError: '' });\n    const sb = await getSb();\n    const { data, error } = await sb.auth.signInWithPassword({ email: s.authEmail.trim(), password: s.authPassword });\n    if (error) { this.setState({ authBusy: false, authError: error.message }); return; }\n    await this.loadUserData(data.session.user);\n  };\n\n  logout = async () => {\n    const sb = await getSb();\n    await sb.auth.signOut();\n    this.setState({\n      screen: 'welcome', activeTab: 'home', session: null, userEmail: '',\n      accounts: [], transactions: [], budgets: [], holdings: [], goals: [],\n      authEmail: '', authPassword: '', authError: '',\n    });\n  };\n\n  setTabHome = () => this.setState({ activeTab: 'home' });\n  setTabBudgets = () => this.setState({ activeTab: 'budgets' });\n  setTabInvestments = () => this.setState({ activeTab: 'investments' });\n  setWeek = () => this.setState({ period: 'week' });\n  setMonth = () => this.setState({ period: 'month' });\n\n  openAddAccount = () => this.setState({ addAccountOpen: true, newAccountName: '', newAccountKind: '', newAccountBalance: '' });\n  closeAddAccount = () => this.setState({ addAccountOpen: false });\n  onAccountNameInput = (e) => this.setState({ newAccountName: e.target.value });\n  onAccountKindInput = (e) => this.setState({ newAccountKind: e.target.value });\n  onAccountBalanceInput = (e) => this.setState({ newAccountBalance: e.target.value });\n  submitAccount = async () => {\n    const s = this.state;\n    const name = s.newAccountName.trim();\n    if (!name) return;\n    this.setState({ formBusy: true });\n    const sb = await getSb();\n    const { data, error } = await sb.from('accounts').insert({\n      name, kind: s.newAccountKind.trim() || 'Cuenta', initial_balance: parseInt(s.newAccountBalance, 10) || 0,\n    }).select().single();\n    this.setState({ formBusy: false });\n    if (error) { console.error(error); return; }\n    this.setState(s2 => ({ accounts: [...s2.accounts, data], addAccountOpen: false }));\n  };\n\n  openAddTx = () => this.setState(s => ({\n    addTxOpen: true, newTxType: 'expense',\n    newTxAccountId: s.accounts[0] ? s.accounts[0].id : '',\n    newTxCategory: '', newTxAmount: '', newTxNote: '',\n  }));\n  closeAddTx = () => this.setState({ addTxOpen: false });\n  setTxExpense = () => this.setState({ newTxType: 'expense' });\n  setTxIncome = () => this.setState({ newTxType: 'income' });\n  onTxAccountInput = (e) => this.setState({ newTxAccountId: e.target.value });\n  onTxCategoryInput = (e) => this.setState({ newTxCategory: e.target.value });\n  onTxAmountInput = (e) => this.setState({ newTxAmount: e.target.value });\n  onTxNoteInput = (e) => this.setState({ newTxNote: e.target.value });\n  submitTx = async () => {\n    const s = this.state;\n    const amount = parseInt(s.newTxAmount, 10);\n    if (!amount || amount <= 0 || !s.newTxAccountId) return;\n    this.setState({ formBusy: true });\n    const sb = await getSb();\n    const { data, error } = await sb.from('transactions').insert({\n      account_id: s.newTxAccountId,\n      type: s.newTxType,\n      category: s.newTxCategory.trim() || 'Otros',\n      amount,\n      note: s.newTxNote.trim() || null,\n    }).select().single();\n    this.setState({ formBusy: false });\n    if (error) { console.error(error); return; }\n    this.setState(s2 => ({ transactions: [data, ...s2.transactions], addTxOpen: false }));\n  };\n\n  openImport = () => this.setState(s => ({\n    importOpen: true,\n    importAccountId: s.accounts[0] ? s.accounts[0].id : '',\n    importFileName: '', importHeaders: [], importRows: [],\n    importDateCol: '', importAmountCol: '', importDescCol: '',\n    importSign: 'negative', importError: '',\n  }));\n  closeImport = () => this.setState({ importOpen: false });\n  onImportAccountInput = (e) => this.setState({ importAccountId: e.target.value });\n  onImportDateColInput = (e) => this.setState({ importDateCol: e.target.value });\n  onImportAmountColInput = (e) => this.setState({ importAmountCol: e.target.value });\n  onImportDescColInput = (e) => this.setState({ importDescCol: e.target.value });\n  setImportSignNegative = () => this.setState({ importSign: 'negative' });\n  setImportSignPositive = () => this.setState({ importSign: 'positive' });\n\n  onImportFileChange = (e) => {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => {\n      const { headers, rows } = parseCsv(String(reader.result || ''));\n      if (headers.length === 0 || rows.length === 0) {\n        this.setState({ importError: 'No se pudieron leer filas de ese archivo.', importHeaders: [], importRows: [] });\n        return;\n      }\n      this.setState({\n        importFileName: file.name,\n        importHeaders: headers,\n        importRows: rows,\n        importDateCol: guessColumn(headers, ['fecha', 'date']),\n        importAmountCol: guessColumn(headers, ['monto', 'importe', 'amount', 'valor']),\n        importDescCol: guessColumn(headers, ['descrip', 'concepto', 'detalle', 'concept']),\n        importError: '',\n      });\n    };\n    reader.onerror = () => this.setState({ importError: 'No se pudo leer el archivo.' });\n    reader.readAsText(file, 'utf-8');\n  };\n\n  submitImport = async () => {\n    const s = this.state;\n    if (!s.importAccountId || s.importRows.length === 0 || !s.importDateCol || !s.importAmountCol) return;\n    const dateIdx = s.importHeaders.indexOf(s.importDateCol);\n    const amountIdx = s.importHeaders.indexOf(s.importAmountCol);\n    const descIdx = s.importDescCol ? s.importHeaders.indexOf(s.importDescCol) : -1;\n    const toInsert = [];\n    for (const row of s.importRows) {\n      const occurred_at = parseDateFlexible(row[dateIdx]);\n      const rawAmount = parseAmountAR(row[amountIdx]);\n      if (!occurred_at || Number.isNaN(rawAmount) || rawAmount === 0) continue;\n      const isExpense = s.importSign === 'negative' ? rawAmount < 0 : rawAmount > 0;\n      const desc = descIdx !== -1 ? row[descIdx] : '';\n      toInsert.push({\n        account_id: s.importAccountId,\n        type: isExpense ? 'expense' : 'income',\n        category: guessCategory(desc),\n        amount: Math.abs(rawAmount),\n        note: desc || null,\n        occurred_at,\n      });\n    }\n    if (toInsert.length === 0) {\n      this.setState({ importError: 'No se detectó ningún movimiento válido con esas columnas.' });\n      return;\n    }\n    this.setState({ formBusy: true, importError: '' });\n    const sb = await getSb();\n    const { data, error } = await sb.from('transactions').insert(toInsert).select();\n    this.setState({ formBusy: false });\n    if (error) { this.setState({ importError: error.message }); return; }\n    this.setState(s2 => ({ transactions: [...(data || []), ...s2.transactions], importOpen: false }));\n  };\n\n  openAddBudget = () => this.setState({ addBudgetOpen: true, newBudgetCategory: '', newBudgetLimit: '' });\n  closeAddBudget = () => this.setState({ addBudgetOpen: false });\n  onBudgetCategoryInput = (e) => this.setState({ newBudgetCategory: e.target.value });\n  onBudgetLimitInput = (e) => this.setState({ newBudgetLimit: e.target.value });\n  submitBudget = async () => {\n    const s = this.state;\n    const category = s.newBudgetCategory.trim();\n    const limit_amount = parseInt(s.newBudgetLimit, 10);\n    if (!category || !limit_amount) return;\n    this.setState({ formBusy: true });\n    const sb = await getSb();\n    const { data, error } = await sb.from('budgets').insert({ category, limit_amount }).select().single();\n    this.setState({ formBusy: false });\n    if (error) { console.error(error); return; }\n    this.setState(s2 => ({ budgets: [...s2.budgets, data], addBudgetOpen: false }));\n  };\n\n  openAddHolding = () => this.setState({ addHoldingOpen: true, newHoldingName: '', newHoldingTicker: '', newHoldingValue: '' });\n  closeAddHolding = () => this.setState({ addHoldingOpen: false });\n  onHoldingNameInput = (e) => this.setState({ newHoldingName: e.target.value });\n  onHoldingTickerInput = (e) => this.setState({ newHoldingTicker: e.target.value });\n  onHoldingValueInput = (e) => this.setState({ newHoldingValue: e.target.value });\n  submitHolding = async () => {\n    const s = this.state;\n    const name = s.newHoldingName.trim();\n    if (!name) return;\n    this.setState({ formBusy: true });\n    const sb = await getSb();\n    const { data, error } = await sb.from('holdings').insert({\n      name, ticker: s.newHoldingTicker.trim() || null, value: parseInt(s.newHoldingValue, 10) || 0,\n    }).select().single();\n    this.setState({ formBusy: false });\n    if (error) { console.error(error); return; }\n    this.setState(s2 => ({ holdings: [...s2.holdings, data], addHoldingOpen: false }));\n  };\n\n  openAddGoal = () => this.setState({ addGoalOpen: true, newGoalName: '', newGoalAmount: '' });\n  closeAddGoal = () => this.setState({ addGoalOpen: false });\n  onGoalNameInput = (e) => this.setState({ newGoalName: e.target.value });\n  onGoalAmountInput = (e) => this.setState({ newGoalAmount: e.target.value });\n  submitGoal = async () => {\n    const s = this.state;\n    const name = s.newGoalName.trim();\n    const target = parseInt(s.newGoalAmount, 10);\n    if (!name || !target) return;\n    this.setState({ formBusy: true });\n    const sb = await getSb();\n    const { data, error } = await sb.from('goals').insert({ name, target, saved: 0 }).select().single();\n    this.setState({ formBusy: false });\n    if (error) { console.error(error); return; }\n    this.setState(s2 => ({ goals: [...s2.goals, data], addGoalOpen: false }));\n  };\n\n  renderVals() {\n    const s = this.state;\n\n    const periodTx = s.transactions.filter(t =>\n      s.period === 'week' ? isInLastNDays(t.occurred_at, 7) : isInCurrentMonth(t.occurred_at)\n    );\n    const income = periodTx.filter(t => t.type === 'income').reduce((a, t) => a + Number(t.amount), 0);\n    const expenseTx = periodTx.filter(t => t.type === 'expense');\n    const expense = expenseTx.reduce((a, t) => a + Number(t.amount), 0);\n\n    const catMap = new Map();\n    for (const t of expenseTx) catMap.set(t.category, (catMap.get(t.category) || 0) + Number(t.amount));\n    const categories = [...catMap.entries()].sort((a, b) => b[1] - a[1]).map(([name, amount]) => ({\n      name, amountLabel: money(amount),\n      pctWidth: (expense > 0 ? Math.round((amount / expense) * 100) : 0) + '%',\n      icon: iconFor(name),\n    }));\n\n    const balanceFor = (accId) => {\n      const acc = s.accounts.find(a => a.id === accId);\n      if (!acc) return 0;\n      let bal = Number(acc.initial_balance);\n      for (const t of s.transactions) {\n        if (t.account_id !== accId) continue;\n        bal += t.type === 'income' ? Number(t.amount) : -Number(t.amount);\n      }\n      return bal;\n    };\n    const accountsOut = s.accounts.map(a => {\n      const bal = balanceFor(a.id);\n      return { ...a, initial: (a.name[0] || '?').toUpperCase(), balanceLabel: money(bal), selected: a.id === s.newTxAccountId };\n    });\n    const balance = s.accounts.reduce((a, acc) => a + balanceFor(acc.id), 0);\n\n    const importAccountOptions = s.accounts.map(a => ({ ...a, selected: a.id === s.importAccountId }));\n    const colOption = (h) => ({ value: h, label: h });\n    const importDateOptions = s.importHeaders.map(h => ({ ...colOption(h), selected: h === s.importDateCol }));\n    const importAmountOptions = s.importHeaders.map(h => ({ ...colOption(h), selected: h === s.importAmountCol }));\n    const importDescOptions = s.importHeaders.map(h => ({ ...colOption(h), selected: h === s.importDescCol }));\n\n    const monthExpenseByCategory = new Map();\n    for (const t of s.transactions) {\n      if (t.type !== 'expense' || !isInCurrentMonth(t.occurred_at)) continue;\n      monthExpenseByCategory.set(t.category, (monthExpenseByCategory.get(t.category) || 0) + Number(t.amount));\n    }\n    const budgets = s.budgets.map(b => {\n      const spent = monthExpenseByCategory.get(b.category) || 0;\n      const limit = Number(b.limit_amount);\n      const over = spent > limit;\n      const pct = limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0;\n      return {\n        ...b, name: b.category,\n        pctWidth: pct + '%',\n        barColor: over ? 'var(--color-accent-900)' : 'var(--color-accent)',\n        statusColor: over ? 'var(--color-accent-900)' : 'var(--color-text)',\n        statusLabel: over ? 'Excedido' : pct + '%',\n        spentLabel: money(spent), limitLabel: money(limit),\n      };\n    });\n\n    const goals = s.goals.map(g => ({\n      ...g,\n      pctWidth: Math.min(100, Math.round((Number(g.saved) / Number(g.target)) * 100)) + '%',\n      savedLabel: money(g.saved), targetLabel: money(g.target),\n    }));\n\n    const shades = ['var(--color-accent-700)', 'var(--color-accent-500)', 'var(--color-accent-300)', 'var(--color-neutral-400)', 'var(--color-neutral-600)'];\n    const portfolioTotal = s.holdings.reduce((a, h) => a + Number(h.value), 0);\n    const holdings = s.holdings.map((h, i) => ({\n      ...h,\n      allocWidth: (portfolioTotal > 0 ? Math.round((Number(h.value) / portfolioTotal) * 100) : 0) + '%',\n      valueLabel: money(h.value),\n      shade: shades[i % shades.length],\n    }));\n\n    return {\n      isWelcome: s.screen === 'welcome',\n      isSignup: s.screen === 'signup',\n      isLogin: s.screen === 'login',\n      isProcessing: s.screen === 'processing',\n      isApp: s.screen === 'app',\n      processingTitle: s.session ? 'Cargando tus datos' : 'Un momento',\n      processingSubtitle: s.session ? 'Trayendo tus cuentas y movimientos…' : 'Estamos revisando tu sesión…',\n\n      goToWelcome: this.goToWelcome,\n      goToSignup: this.goToSignup,\n      goToLogin: this.goToLogin,\n      authEmail: s.authEmail,\n      authPassword: s.authPassword,\n      authError: s.authError,\n      hasAuthError: !!s.authError,\n      authBusy: s.authBusy,\n      onAuthEmailInput: this.onAuthEmailInput,\n      onAuthPasswordInput: this.onAuthPasswordInput,\n      submitSignup: this.submitSignup,\n      submitLogin: this.submitLogin,\n      logout: this.logout,\n      userLabel: s.userEmail ? s.userEmail.split('@')[0] : '',\n\n      isTabHome: s.activeTab === 'home',\n      isTabBudgets: s.activeTab === 'budgets',\n      isTabInvestments: s.activeTab === 'investments',\n      setTabHome: this.setTabHome,\n      setTabBudgets: this.setTabBudgets,\n      setTabInvestments: this.setTabInvestments,\n      tabColor: {\n        home: s.activeTab === 'home' ? 'var(--color-accent-700)' : 'var(--color-neutral-600)',\n        budgets: s.activeTab === 'budgets' ? 'var(--color-accent-700)' : 'var(--color-neutral-600)',\n        investments: s.activeTab === 'investments' ? 'var(--color-accent-700)' : 'var(--color-neutral-600)',\n      },\n\n      isWeek: s.period === 'week',\n      isMonth: s.period === 'month',\n      setWeek: this.setWeek,\n      setMonth: this.setMonth,\n      totals: { balanceLabel: money(balance), incomeLabel: money(income), expenseLabel: money(expense) },\n\n      accounts: accountsOut,\n      hasAccounts: accountsOut.length > 0,\n      noAccounts: accountsOut.length === 0,\n      categories,\n      hasCategories: categories.length > 0,\n      noCategories: categories.length === 0,\n\n      addAccountOpen: s.addAccountOpen,\n      openAddAccount: this.openAddAccount,\n      closeAddAccount: this.closeAddAccount,\n      newAccountName: s.newAccountName,\n      newAccountKind: s.newAccountKind,\n      newAccountBalance: s.newAccountBalance,\n      onAccountNameInput: this.onAccountNameInput,\n      onAccountKindInput: this.onAccountKindInput,\n      onAccountBalanceInput: this.onAccountBalanceInput,\n      submitAccount: this.submitAccount,\n\n      addTxOpen: s.addTxOpen,\n      openAddTx: this.openAddTx,\n      closeAddTx: this.closeAddTx,\n      isTxExpense: s.newTxType === 'expense',\n      isTxIncome: s.newTxType === 'income',\n      setTxExpense: this.setTxExpense,\n      setTxIncome: this.setTxIncome,\n      newTxCategory: s.newTxCategory,\n      newTxAmount: s.newTxAmount,\n      newTxNote: s.newTxNote,\n      onTxAccountInput: this.onTxAccountInput,\n      onTxCategoryInput: this.onTxCategoryInput,\n      onTxAmountInput: this.onTxAmountInput,\n      onTxNoteInput: this.onTxNoteInput,\n      submitTx: this.submitTx,\n\n      importOpen: s.importOpen,\n      openImport: this.openImport,\n      closeImport: this.closeImport,\n      importAccountOptions,\n      onImportAccountInput: this.onImportAccountInput,\n      onImportFileChange: this.onImportFileChange,\n      importFileName: s.importFileName,\n      hasImportError: !!s.importError,\n      importError: s.importError,\n      hasImportRows: s.importRows.length > 0,\n      importRowCount: s.importRows.length,\n      importDateOptions,\n      importAmountOptions,\n      importDescOptions,\n      onImportDateColInput: this.onImportDateColInput,\n      onImportAmountColInput: this.onImportAmountColInput,\n      onImportDescColInput: this.onImportDescColInput,\n      importSignIsNegative: s.importSign === 'negative',\n      importSignIsPositive: s.importSign === 'positive',\n      setImportSignNegative: this.setImportSignNegative,\n      setImportSignPositive: this.setImportSignPositive,\n      submitImport: this.submitImport,\n      importSubmitDisabled: s.formBusy || s.importRows.length === 0,\n      importSubmitLabel: s.importRows.length > 0 ? ('Importar ' + s.importRows.length + ' movimientos') : 'Importar',\n\n      budgets,\n      hasBudgets: budgets.length > 0,\n      noBudgets: budgets.length === 0,\n      addBudgetOpen: s.addBudgetOpen,\n      openAddBudget: this.openAddBudget,\n      closeAddBudget: this.closeAddBudget,\n      newBudgetCategory: s.newBudgetCategory,\n      newBudgetLimit: s.newBudgetLimit,\n      onBudgetCategoryInput: this.onBudgetCategoryInput,\n      onBudgetLimitInput: this.onBudgetLimitInput,\n      submitBudget: this.submitBudget,\n\n      goals,\n      hasGoals: goals.length > 0,\n      noGoals: goals.length === 0,\n      addGoalOpen: s.addGoalOpen,\n      openAddGoal: this.openAddGoal,\n      closeAddGoal: this.closeAddGoal,\n      newGoalName: s.newGoalName,\n      newGoalAmount: s.newGoalAmount,\n      onGoalNameInput: this.onGoalNameInput,\n      onGoalAmountInput: this.onGoalAmountInput,\n      submitGoal: this.submitGoal,\n\n      portfolio: { totalLabel: money(portfolioTotal) },\n      holdings,\n      hasHoldings: holdings.length > 0,\n      noHoldings: holdings.length === 0,\n      addHoldingOpen: s.addHoldingOpen,\n      openAddHolding: this.openAddHolding,\n      closeAddHolding: this.closeAddHolding,\n      newHoldingName: s.newHoldingName,\n      newHoldingTicker: s.newHoldingTicker,\n      newHoldingValue: s.newHoldingValue,\n      onHoldingNameInput: this.onHoldingNameInput,\n      onHoldingTickerInput: this.onHoldingTickerInput,\n      onHoldingValueInput: this.onHoldingValueInput,\n      submitHolding: this.submitHolding,\n\n      formBusy: s.formBusy,\n    };\n  }\n\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
